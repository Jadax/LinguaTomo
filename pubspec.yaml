name: linguatomo
description: LinguaTomo, a warm Japanese learning companion by Tushant Sharma and Astraiva.
publish_to: none
version: 1.19.1+44

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.16.0
  share_plus: ^13.3.0
  fsrs: ^2.0.1
  supabase_flutter: ^2.16.0
  flutter_tts: ^4.2.5
  connectivity_plus: ^7.3.1
  audioplayers: ^6.8.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Artwork ships as WebP sized for its largest on-screen use. Re-export
    # from the originals rather than upscaling these.
    - assets/branding/leo-nest-room.webp
    - assets/branding/nest-home-pixel.webp
    - assets/branding/nest-journey-pixel.webp
    - assets/branding/nest-japan-pixel.webp
    - assets/branding/nest-spring-pixel.webp
    - assets/branding/nest-winter-pixel.webp
    - assets/branding/leo-face-icon.webp
    - assets/branding/leo-sprites.webp
    - assets/branding/leo-loading-garden.webp
    - assets/content/grammar/
    # Empty until the achievement chimes are recorded; declared so the .mp3
    # files bundle as soon as they are dropped in. See docs/ROADMAP.md.
    - assets/sounds/
